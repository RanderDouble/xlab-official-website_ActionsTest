name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 v1.2.3）
        required: true

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 备份当前版本
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /backup
            BACKUP_FILE="/backup/app-prod-back-$(date +%Y%m%d-%H%M%S).tar.gz"
            cd /opt/app/prod
            tar -czf "$BACKUP_FILE" .
            ls -lt /backup/app-prod-back-*.tar.gz | head -1

  deploy:
    needs: backup
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建（在 Actions 上）
        run: npm run build
        env:
          NODE_ENV: production

      - name: 同步到服务器（生产环境）
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude=node_modules
          path: .
          remote_path: /opt/app/prod
          remote_host: ${{ secrets.TEST_SERVER_HOST }}
          remote_user: ${{ secrets.TEST_SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 部署应用（可能失败，需要回滚）
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /opt/app/prod
            npm ci --production
            if pm2 describe app-prod >/dev/null 2>&1; then
              pm2 restart app-prod
            else
              pm2 start npm --name app-prod -- start
            fi

      - name: 健康检查（可能失败，需要回滚）
        id: health_check
        continue-on-error: true
        run: |
          for i in {1..30}; do
            curl -f http://${{ secrets.TEST_SERVER_HOST }}/ && break || sleep 2
          done

      - name: 回滚
        if: ${{ steps.deploy.outcome == 'failure' || steps.health_check.outcome == 'failure' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "部署失败，开始回滚..."
            BACKUP_FILE=$(ls -t /backup/app-prod-back-*.tar.gz | head -1)

            cd /opt/app/prod
            tar -xzf "$BACKUP_FILE" -C .

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            if pm2 describe app-prod >/dev/null 2>&1; then
              pm2 restart app-prod
            else
              pm2 start npm --name app-prod -- start
            fi

            echo "回滚完成，已恢复到上一个版本"

      - name: 创建 Git 标签
        if: ${{ success() }}
        run: |
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: 部署成功通知
        if: ${{ success() }}
        run: |
          echo "生产环境部署成功！版本：${{ inputs.version }}"

      - name: 部署失败通知
        if: ${{ steps.deploy.outcome == 'failure' || steps.health_check.outcome == 'failure' }}
        run: |
          echo "生产环境部署失败！已自动回滚到上一个版本"
