name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 v1.2.3）
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://example.com
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建（在 Actions 上）
        run: npm run build
        env:
          NODE_ENV: production

      - name: 备份当前版本到 prod-prev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            mkdir -p /opt/app/prod-prev
            echo "start backup to prod-prev"
            rsync -a --delete /opt/app/prod/ /opt/app/prod-prev/
            echo "backup done"

      - name: 同步到服务器（生产环境）
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude=node_modules --exclude=.git --exclude=.github
          path: .
          remote_path: /opt/app/prod
          remote_host: ${{ secrets.TEST_SERVER_HOST }}
          remote_user: ${{ secrets.TEST_SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 部署应用（可能失败，需要回滚）
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "pm2: $(pm2 -v)"

            cd /opt/app/prod
            echo "start npm ci"
            npm ci --omit=dev
            echo "npm ci done"

            if pm2 describe app-prod >/dev/null 2>&1; then
              echo "restart pm2 app-prod"
              PORT=3001 pm2 restart app-prod --update-env
            else
              echo "start pm2 app-prod"
              PORT=3001 pm2 start npm --name app-prod -- start
            fi

            echo "deploy done"
            pm2 status app-prod

            echo "模拟部署失败"
            exit 1

      - name: 健康检查（可能失败，需要回滚）
        id: health_check
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in {1..30}; do
              curl -sf http://127.0.0.1:3001/ && exit 0 || sleep 2
            done
            exit 1

      - name: 回滚
        if: ${{ steps.deploy.outcome == 'failure' || steps.health_check.outcome == 'failure' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "部署失败，开始回滚..."
            rsync -a --delete /opt/app/prod-prev/ /opt/app/prod/
            echo "文件回滚完成"

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            if pm2 describe app-prod >/dev/null 2>&1; then
              PORT=3001 pm2 restart app-prod --update-env
            else
              PORT=3001 pm2 start npm --name app-prod -- start
            fi

            echo "回滚完成，已恢复到上一个版本"

      - name: 部署成功通知
        if: ${{ steps.deploy.outcome == 'success' && steps.health_check.outcome == 'success' }}
        run: echo "生产环境部署成功！版本：${{ inputs.version }}"

      - name: 部署失败通知
        if: ${{ steps.deploy.outcome == 'failure' || steps.health_check.outcome == 'failure' }}
        run: echo "生产环境部署失败！已自动回滚到上一个版本"
