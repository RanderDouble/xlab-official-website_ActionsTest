name: 测试部署到阿里云服务器

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
        env:
          NODE_ENV: production

      - name: 同步到服务器
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --progress
          path: .
          remote_path: /tmp/official-website-test
          remote_host: ${{ secrets.TEST_SERVER_HOST }}
          remote_user: ${{ secrets.TEST_SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          exclude: node_modules/.cache

      - name: 安装依赖并启动 PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /tmp/official-website-test
            npm ci --production
            pm2 delete official-website-test || true
            pm2 start npm --name official-website-test -- start
