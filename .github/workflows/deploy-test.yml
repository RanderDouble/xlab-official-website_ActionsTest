name: 测试部署到我的服务器

on:
push:
  branches: [dev]

env:
TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}

jobs:
deploy:
  runs-on: ubuntu-latest

  steps:
	- name: 检出代码
	  uses: actions/checkout@v4

	- name: 设置 Node.js
	  uses: actions/setup-node@v4
	  with:
		node-version: '18'
		cache: 'npm'

	- name: 安装依赖
	  run: npm ci

	- name: 构建
	  run: npm run build
	  env:
		NODE_ENV: production

	- name: 同步到测试服务器
	  uses: burnett01/rsync-deployments@6.0.0
	  with:
		switches: -avzr --delete --progress
		path: .next/
		remote_path: /tmp/official-website-test/
		remote: ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}
		key: ${{ secrets.SSH_PRIVATE_KEY }}

	- name: 部署到测试服务器
	  uses: appleboy/ssh-action@master
	  with:
		host: ${{ secrets.TEST_SERVER_HOST }}
		username: ${{ secrets.TEST_SERVER_USER }}
		key: ${{ secrets.SSH_PRIVATE_KEY }}
		script: |
		  echo "部署到测试服务器..."
		  ls -la /tmp/official-website-test/
		  echo "✅ 部署成功！"
